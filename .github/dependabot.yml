version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
      dependencies: { dependency-type: production }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
# Container images (Tesserae, cloudflared) are pinned and upgraded by hand on purpose.
