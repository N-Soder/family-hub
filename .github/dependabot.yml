version: 2
updates:
  # Minor and patch updates arrive grouped; each major upgrade gets its own PR,
  # since those usually need code changes (see docs/roadmap.md).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
# Container images (Tesserae, cloudflared) are pinned and upgraded by hand on purpose.
